<!-- settings screen, need to find a way to autogenerate the settings -->
<div class="settings-section-container">
    <ul class="settings-list">
        <li class="settings-section-title">Timetable</li>
        <li class="settings-description">When does your week start (default : 0 - Monday)</li>
        <li class="settings-option-name">Starting Day <div class="settings-flex-seperator"></div> <input data-optionName="starting_day" id="starting-day-input" class="settings-number-input settings-option" type="number" min="0" max="6" size="2"/></li>
        <li class="settings-description">When does your day start (default : 5am)</li>
        <li class="settings-option-name">Starting Hour <div class="settings-flex-seperator"></div> <input data-optionName="starting_hour" id="starting-hour-input" class="settings-number-input settings-option" type="number" min="0" max="24" size="2"/></li>
    </ul>
</div>

<div class="settings-section-container">
    <input id="settings-save-button" type="submit" value="SAVE" onclick="saveSettings()"></input>
</div>




<!-- settings script -->
<script>
    // takes the settings from the settings page and sends the values to the server to update
    // TODO: need to only send values that have been altered
    async function saveSettings() {
        try {
            console.log("Attempting to update settings")

            const settings_options = document.getElementsByClassName("settings-option");
            var options_data = {};
            for (let option of settings_options) {
                options_data[option.getAttribute("data-optionName")] = option.value;
            }

            console.log(options_data);

            const response = await fetch(settingsUrl+"/update", {
                method: 'POST',
                headers: {
                    'Content-Type' : 'application/json',
                    'Accept' : 'application/json'
                },
                body: JSON.stringify(options_data)
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status} - ${response.statusText}`);
            }


            const data = await response.json();

            applySettings(data["settings"]);
            
            persistentSettings = null;
        } catch (err) {
            console.error('Failed to update settings: ', err);
            throw err;
        }
    }
    
    // apply settings to timetable. need to automatically parse and apply these settings
    async function applySettings(settings = null) {
        if (!settings) settings = await fetchSettings();
        console.log(settings)
        document.getElementById('starting-day-input').value = settings['starting_day'];
        document.getElementById('starting-hour-input').value = settings['starting_hour'];
    }

    async function initSettings() {
        console.log("initialising settings")
        await applySettings();
    }

    window.pageInits = window.pageInits || {};
    window.pageInits.settings = initSettings;

</script>
