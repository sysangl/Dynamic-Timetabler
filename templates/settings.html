<!-- shared forms css -->
<link rel="stylesheet" href="{{url_for('static', filename='css/forms.css')}}"></link>


<form id="settings-form" class="form-body" method="post" action="{{ url_for('settings.update') }}">

    <fieldset class="card-section">
        <legend class="section-title">General</legend>

        <div class="field-group">
            <label for="start_day">Starting day<span class="hint">(0 = Mon .. 6 = Sun)</span></label>
                <input id="start_day" name="start_day" type="number" min="0" max="6" placeholder="0-6" class="field-input" />
        </div>

        <div class="field-group">
            <label for="start_hour">Starting hour<span class="hint"> (0-23)</span></label>
            <input id="start_hour" name="start_hour" type="number" min="0" max="23" placeholder="0-23" class="field-input" />
        </div>
    </fieldset>

    <fieldset class="card-section">
        <legend class="section-title">Blocks</legend>

        <div class="field-group">
            <label for="default_block_length">Default block length (minutes)</label>
            <input id="default_block_length" name="default_block_length" type="number" min="0" max="720" placeholder="30" class="field-input" />
        </div>

        <div class="field-group">
            <label for="default_block_colour">Default block colour</label>
            <input id="default_block_colour" name="default_block_colour" type="color" disabled class="field-input colour-input" />
        </div>
    </fieldset>

    <div class="form-actions">
        <button id="settings-save-button" class="submit-button" type="submit">SAVE</button>
    </div>
</form>


<!-- settings script -->
<script src="{{url_for('static',filename='js/settings.js')}}"></script>
