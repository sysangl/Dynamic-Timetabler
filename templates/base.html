<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Timetable</title>
    <link rel="icon" href="{{url_for('static', filename='favicon.ico')}}"/>
    <script src="{{url_for('static',filename='js/jquery-4.0.0.min.js')}}"></script>
    <link rel="stylesheet" href="{{url_for('static', filename='fontawesome-free-7.3.1-web/css/all.min.css')}}"/>
</head>
<body>
    <!-- common script -->
    <script>
        
        // Sidebar toggle
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const container = document.getElementById('content');
            const ham = document.querySelector('.ham');

            sidebar.classList.toggle('expanded');
            container.classList.toggle('pushed');
            ham.classList.toggle('active');
        }

        const initialPage = "{{ page }}"
        document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.toggle('active', b.dataset.page===initialPage))

        var persistentSettings = null;
        const settingsUrl = 'http://localhost:58362/server/user/1/settings'



        // send a request to the server for the current user's settings, currently hardcoded to user 1
        async function fetchSettings(userId) {
            if (persistentSettings == null) {
                try {
                    console.log("Attempting to fetch settings")
                    const response = await fetch(settingsUrl, {
                        method: 'GET',
                        headers: {
                            'Accept' : 'application/json'
                        },
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status} - ${response.statusText}`);
                    }

                    const data = await response.json();

                    persistentSettings = data["settings"];
                    return data["settings"];
                } catch (err) {
                    console.error('Failed to fetch settings JSON:', err);
                    throw err;
                }
            } else {
                console.log("Using cached settings")
                return persistentSettings;
            }

        }
    
        document.addEventListener('fragmentloaded', e => {
            const page = e.detail.page;          // e.g. "settings"
            const registry = window.pageInits || {};

            console.log(registry)

            if (typeof registry[page] === 'function') {
                // Call the init routine that the fragment has registered
                registry[page]();
            } else {
                console.warn(`No init function registered for page "${page}"`);
            }

            window.pageIntervals.temporary.forEach(i => clearInterval(i))

        });

        function clearFragmentInterval(name) {
            clearInterval(window.pageIntervals.persistent[name]);
        }
        
        window.pageIntervals = window.pageIntervals || {};
        window.pageIntervals.temporary = window.pageIntervals.temporary || [];
        window.pageIntervals.persistent = window.pageIntervals.persistent || {};


    </script>



    <!-- common css -->
    <style>
        @font-face {
            font-family: Aleo;
            src: url("{{url_for('static', filename='fonts/Aleo/Aleo-VariableFont_wght.ttf')}}");
        }

        :root {
            --sidebar-width: 200px;
            --highlight-colour: rgb(137, 15, 165);
            --bg-colour-1: #1e1e1e;
            --text-colour-1: #f5f5f5;
            --font-1: 'Aleo';

        }

        html {
            overscroll-behavior: none;
        }

        body {
            background-color: var(--bg-colour-1);
            font-family: var(--font-1);
            margin:0;
            overscroll-behavior: none;
            height: 100vh;
            color: var(--text-colour-1);
        }
        
        #content {
            background: var(--bg-colour-1);
            padding: 50px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            height: calc(100% - 60px);
            box-sizing: border-box;

            transition: margin-left 0.3s ease;
            margin-left: 0;
        }

        #content.pushed {
            margin-left: var(--sidebar-width);
        }

        input, button {
            border: 0;
        }

    </style>

    <!-- menus css -->
    <style>
        #topbar {
            position: sticky;
            width: 100%;
            height: 60px;
            background: var(--highlight-colour);
            display: flex;
            align-content: center;
        }

        #topbar-title {
            font-size: 1.6rem;
            font-family: var(--font-1);
            color: #e1e1e1;
            left: 15px;
            align-content: center;
        }

        #topbar-user {
            width: 60px;
            color: var(--text-colour-1);
            font-size: 40px;
            align-content: center;
            text-align: center;
            justify-content: center;
            right: 0;
        }

        .topbar-spacer {
            flex-grow: 100;
        }

        .ham {
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: transform 400ms;
            -moz-user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .hamRotate.active {
            transform: rotate(45deg);
        }

        .line {
            fill:none;
            transition: stroke-dasharray 400ms, stroke-dashoffset 400ms;
            stroke:#e1e1e1;
            stroke-width:4;
            stroke-linecap:round;
        }

        .ham4 .top {
            stroke-dasharray: 40 121;
        }
        .ham4 .bottom {
            stroke-dasharray: 40 121;
        }
        .ham4.active .top {
            stroke-dashoffset: -68px;
        }
        .ham4.active .bottom {
            stroke-dashoffset: -68px;
        }

        #sidebar {
            position: absolute;
            left: 0;
            top: 60px;
            width: 0;
            height: calc(100% - 60px);
            background: #454545;
            overflow: hidden;
            transition: width 0.3s ease;
            z-index: 5;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        #sidebar.expanded {
            width: var(--sidebar-width);
        }

        #sidebar ul {
            margin: 0;
            list-style-type: none;
            left: 0;
            padding: 0;
        }

        .sidebar-btn {
            width: var(--sidebar-width);
            padding: 15px;
            left: 0;
            text-align: left;
            border-left: none; border-right: none; border-top: none;
            border-bottom: 0 1px solid rgba(255,255,255, 0.5);
            background-color: rgba(255,255,255,0);
            transition: background-color 0.2s ease;
            color: var(--text-colour-1);
            text-decoration: none;
            font-size: 20px;
        }

        .sidebar-btn:hover {
            background-color: rgba(255, 255, 255, 0.25);
        }



    </style>

    <div id="topbar">
        <div>
            <svg class="ham hamRotate ham4" viewBox="0 0 100 100" width="60" onclick="toggleSidebar()">
            <path
                    class="line top"
                    d="m 70,33 h -40 c 0,0 -8.5,-0.149796 -8.5,8.5 0,8.649796 8.5,8.5 8.5,8.5 h 20 v -20" />
            <path
                    class="line middle"
                    d="m 70,50 h -40" />
            <path
                    class="line bottom"
                    d="m 30,67 h 40 c 0,0 8.5,0.149796 8.5,-8.5 0,-8.649796 -8.5,-8.5 -8.5,-8.5 h -20 v 20" />
            </svg>
        </div>
        <div id="topbar-title">Dynamic Timetabler</div>
        <div class="topbar-spacer"></div>
        <div id="topbar-user"><span class="fa-solid fa-circle-user"></span></div>
    </div>

    <nav id="sidebar">
        <button class="sidebar-btn" data-page="timetable"><span class="fa fa-calendar"></span> Timetable</button>
        <button class="sidebar-btn" data-page="settings"><span class="fa fa-cog"></span> Settings</button>
    </nav>

    <div id="content">
        {% include page ~ ".html" %}
    </div>

    <!-- client side router script -->
    <script>

        (() => {
            const contentDiv = document.getElementById('content');
            const buttons = document.querySelectorAll('.sidebar-btn');

            // helper func, loads the fragments and puts it into #content
            async function loadPage(page, push = true) {
                if(!['timetable','settings'].includes(page)) page = 'unknown';

                // getch fragment 
                const response = await fetch(`/page/${page}`, {
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                });

                if (!response.ok) {
                    console.error(`Failed to load ${page}`, response.status);
                    return;
                }

                // replace view
                const html = await response.text();
                contentDiv.innerHTML = html;

                const scripts = contentDiv.querySelectorAll('script');

                for (const oldScript of scripts) {
                    const newScript = document.createElement('script');

                    // Copy *all* attributes (src, type, async, defer, crossorigin …)
                    for (const attr of oldScript.attributes) {
                        newScript.setAttribute(attr.name, attr.value);
                    }

                    // Make the script **synchronous** (important!)
                    newScript.async = false;

                    if (!oldScript.src) {
                        newScript.textContent = oldScript.textContent;
                    }

                    // Replace the old node → triggers immediate execution
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                }

                contentDiv.dispatchEvent(new CustomEvent('fragmentloaded', {
                    bubbles: true,
                    detail: { page }
                }));

                // update nav buttoms
                buttons.forEach(b => b.classList.toggle('active', b.dataset.page === page));

                // push entry (new url)
                if (push) {
                    const url = page === 'timetable' ? '/app' : `/app/${page}`;
                    history.pushState({ page }, '', url);
                }


            }

            // button listener (handles clicks)
            buttons.forEach(btn => {
                btn.addEventListener('click', e => {
                    const targetPage = btn.dataset.page;
                    loadPage(targetPage);
                });
            });

            // back/forward navigation from browser buttons
            window.addEventListener('popstate', e => {
                const page = e.state?.page || location.pathname.replace(/^\//,'') || 'home';
                loadPage(page, false); // dont push new history
            });

            // direct page navigation
            // we make sure to have the correct history for button navigation (back-button)
            window.addEventListener('load', () => {
                const initialPage = location.pathname.replace(/^\//, '') || 'home';
                history.replaceState({ page: initialPage},'');
            });

        })();

    </script>

    <!-- initialise -->
    <script>
        document.getElementById('content')
                .dispatchEvent(new CustomEvent('fragmentloaded', {
                    bubbles: true,
                    detail: { page: initialPage }
                }));
    </script>

</body>
</html>
