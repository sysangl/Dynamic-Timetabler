<!-- management -->
<link rel="stylesheet" href="{{url_for('static', filename='css/scheduler.css')}}"></link>
<!-- shared forms css -->
<link rel="stylesheet" href="{{url_for('static', filename='css/forms.css')}}"></link>

<div id="item-container">
    <header>
        <span class="title">Activities&nbsp;</span>
        <span id="item-table-title" class="title"></span>
        <span id="counter">| <span id="item-counter">0</span> Activities</span>
        <div></div>
        <button id="generate-timetable-btn" onclick="generateTimetable()">GENERATE</button>
        <button id="create-new-btn" onclick="toggleForms()">New Activity</button>
    </header>
    <table id="item-table">
        <thead>
            <tr>
                <th onclick="sortTable(0)">Name <span class="table-sort-arrows fa-solid fa-sort"></span></th>
                <th onclick="sortTable(1)">Priority <span class="table-sort-arrows fa-solid fa-sort"></span></th>
                <th onclick="sortTable(2)">Frequency <span class="table-sort-arrows fa-solid fa-sort"></span></th>
                <th onclick="sortTable(3)">Min Time <span class="table-sort-arrows fa-solid fa-sort"></span></th>
                <th onclick="sortTable(4)">Max Length<span class="table-sort-arrows fa-solid fa-sort"></span></th>
            </tr>
        </thead>
        
        <tbody id="item-table-body">
        </tbody>

    </table>

</div>


<div id="item-forms" class="hidden">
<div id="form-error-messages"></div>
<div id="activities-form-container" class="form-container">
    <form id="activities-form" class="item-form form-body" method="post" action="{{ url_for('timetable.create_item', item='activity') }}">
        <fieldset class="card-section">
            <legend class="section-title">General information</legend>

            <div class="field-group">
                <label for="name">Name</label>
                <input id="name" name="name" type="text" maxlength="30" required class="field-input" placeholder="Short title">
            </div>

            <div class="field-group">
                <label for="description">Description</label>
                <input id="description" name="description" type="text" maxlength="300" class="field-input" placeholder="Optional longer description">
            </div>
        </fieldset>

        <fieldset class="card-section">
            <legend class="section-title">Parameters</legend>

            <div class="field-group">
                <label for="priority">Priority</label>
                <input id="priority" name="priority" type="number" required class="field-input" value="0">
            </div>

            <div class="field-group">
                <label for="frequency">Frequency</label>
                <input id="frequency" name="frequency" type="number" required class="field-input" value="1">
            </div>

            <div class="field-group">
                <label for="even_frequency_spacing">Even spacing</label>
                <input id="even_frequency_spacing" name="even_frequency_spacing" type="checkbox" class="field-input">
            </div>

            <div class="field-group">
                <label for="max_length">Max length</label>
                <input id="max_length" name="max_length" type="number" class="field-input">
            </div>

            <div class="field-group">
                <label for="min_time">Min time</label>
                <input id="min_time" name="min_time" type="number" class="field-input">
            </div>
        </fieldset>

        <div class="form-actions">
            <button id="form-cancel-button" class="cancel-button form-btn" type="reset">Clear</button>
            <button id="form-submit-button" class="submit-button form-btn" type="submit">Create</button>
        </div>
    </form>

</div>
</div>

<div id="backdrop" onclick="toggleForms()" class="hidden fill-available"></div>


<!-- settings script -->
<script src="{{url_for('static',filename='js/scheduler.js')}}"></script>
