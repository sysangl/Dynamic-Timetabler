<link rel="stylesheet" href="{{url_for('static', filename='css/pomodoro.css')}}">
</link>

<!-- TODO: Style this as a tomato plant? Each break is a tomato. It ripens as the session goes on, and falls when its break time -->


<div id="pomo-container">
    <div class="pomo-controls">
        <div>
            <button type="button" onclick="decSession('1')">-</button>
            <span id="session-mins">60</span>
            <button type="button" onclick="incSession('1')">+</button>
        </div>
        <div></div>
        <div>
            <button type="button" onclick="decBreak('1')">-</button>
            <span id="break-mins">15</span>
            <button type="button" onclick="incBreak('1')">+</button>
        </div>
    </div>
    
    <div class="pomo-timer">
        <span class="remaining-mins">60</span>
        <span class="pomo-state">Session</span>
    </div>

</div>

<script src="{{url_for('static',filename='js/pomodoro.js')}}"></script>
