<!-- base timetable css -->
<link rel="stylesheet" href="{{url_for('static', filename='css/timetable.css')}}"></link>
<!-- horizontal/vertical view -->
{% if current_user.settings.timetable_view == 'horizontal' %}
    <link rel="stylesheet" href="{{url_for('static', filename='css/horizontal-timetable.css')}}"></link>
{% else %}
    <link rel="stylesheet" href="{{url_for('static', filename='css/vertical-timetable.css')}}"></link>
{% endif %}


<!-- main timetable screen -->
<div id="timetable-container">
    <div id="tt-legend">
        <div id="tt-time">-</div>
        <div class="tt-weekday">Mon</div>
        <div class="tt-weekday">Tues</div>
        <div class="tt-weekday">Wed</div>
        <div class="tt-weekday">Thurs</div>
        <div class="tt-weekday">Fri</div>
        <div class="tt-weekday">Sat</div>
        <div class="tt-weekday">Sun</div>
    </div>
    
    <div id="tt-schedule-container">
        <div id="time-marker"></div>
        <div id="tt-timeline"></div>
        <div id="tt-schedule">
            <div id="day-lines"></div>
            <div id="hour-lines"></div>
        </div>
    </div>
</div>

<div id="popup-menu">
    <button type="button" onclick="deleteBlock()">Delete</button>
    <button type="button" onclick="editBlock()" disabled="true">Edit</button>
    <button type="button" onclick="completeBlock()" disabled="true">Complete</button>
    <button type="button" onclick="markRescheduleBlock()" disabled="true">Reschedule</button>
</div>

<div id="backdrop"></div>


<!-- generate timetable script -->
<!-- <script src="{{url_for('static',filename='js/build_timetable.js')}}"></script> -->

<!-- timetable functionality script -->
<script src="{{url_for('static',filename='js/timetable.js')}}"></script>
