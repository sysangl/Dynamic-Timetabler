<!-- management -->
<link rel="stylesheet" href="{{url_for('static', filename='css/management.css')}}"></link>
<!-- shared forms css -->
<link rel="stylesheet" href="{{url_for('static', filename='css/forms.css')}}"></link>

<div id="item-container">
    <header>
        <span class="title">Timetable Items |&nbsp;</span>
        <span id="item-table-title" class="title"></span>
        <span id="counter">| <span id="item-counter">0</span> Item(s)</span>
        <div></div>
        <button onclick="document.getElementById('filter-container').classList.toggle('hidden')"><span class="fa-solid fa-filter"></span></button>
        <select id="item-select" class="field-input" >
            <option onclick="changeTable('all')" value="all" selected>All</option>
            <option onclick="changeTable('blocks')" value="blocks">Blocks</option>
            <option onclick="changeTable('activities')" value="activities">Activities</option>
            <option onclick="changeTable('tasks')" value="tasks" disabled>Tasks</option>
            <option onclick="changeTable('routines')" value="routines" disabled>Routines</option>
        </select>
        <button id="create-new-btn" onclick="toggleForms()" disabled>CREATE NEW</button>
    </header>
    <div id="filter-container" class="hidden">
        <form id="filter-form">
            <fieldset class="card-section">
                <legend class="section-title">Date Range</legend>
                <div class="field-group filter-group">
                    <label for="filter-date-from">From</label>
                    <input id="filter-date-from" name="filter_date_from" type="date" class="field-input">
                </div>
        
                <div class="field-group filter-group">
                    <label for="filter-date-to">To</label>
                    <input id="filter-date-to" name="filter_date_to" type="date" class="field-input">
                </div>
            </fieldset>
            <div id="filter-actions" class="form-actions">
                <button id="filter-apply-btn" class="submit-button" type="submit">Apply Filters</button>
                <button id="filter-remove-btn" class="cancel-button" type="reset">Remove Filters</button>
            </div>
        </form>
    </div>
    <table id="item-table">
        <thead>
            <tr>
                <th onclick="sortTable(0)">Type <span class="table-sort-arrows fa-solid fa-sort"></span></th>
                <th onclick="sortTable(1)">Title <span class="table-sort-arrows fa-solid fa-sort"></span></th>
                <th onclick="sortTable(2)">Start <span class="table-sort-arrows fa-solid fa-sort"></span></th>
                <th onclick="sortTable(3)">End <span class="table-sort-arrows fa-solid fa-sort"></span></th>
                <th onclick="sortTable(4)">Status <span class="table-sort-arrows fa-solid fa-sort"></span></th>
            </tr>
        </thead>
        
        <tbody id="item-table-body">
        </tbody>

    </table>

</div>


<div id="item-forms" class="hidden">
<div id="form-error-messages"></div>
<div id="blocks-form-container" class="form-container">
    <form id="blocks-form" class="item-form form-body" method="post" action="{{ url_for('timetable.create_item', item='block') }}">

        <fieldset class="card-section">
            <legend class="section-title">General information</legend>

            <div class="field-group">
                <label for="title">Title</label>
                <input id="title" name="title" type="text" maxlength="30" required class="field-input" placeholder="Short title">
            </div>

            <div class="field-group">
                <label for="description">Description</label>
                <input id="description" name="description" type="text" maxlength="300" class="field-input" placeholder="Optional longer description">
            </div>
        </fieldset>

        <fieldset class="card-section">
            <legend class="section-title">When does it happen?</legend>

            <div class="field-group">
                <label for="sdate">Start date</label>
                <input id="sdate" name="start_date" type="date" required class="field-input">
            </div>

            <div class="field-group">
                <label for="stime">Start time</label>
                <input id="stime" name="start_time" type="time" required class="field-input">
            </div>

            <div class="field-group">
                <label for="edate">End date</label>
                <input id="edate" name="end_date" type="date" required class="field-input">
            </div>

            <div class="field-group">
                <label for="etime">End time</label>
                <input id="etime" name="end_time" type="time" required class="field-input">
            </div>
        </fieldset>

        <fieldset class="card-section">
            <legend class="section-title">Appearance</legend>

            <div class="field-group">
                <label for="colour">Colour</label>
                <input id="colour" name="colour" type="color" value="#155764" class="field-input colour-input">
            </div>
        </fieldset>

        <div class="form-actions">
            <button id="form-cancel-button" class="cancel-button form-btn" type="reset">Clear</button>
            <button id="form-submit-button" class="submit-button form-btn" type="submit">Create</button>
        </div>
    </form>
</div>



<div id="activities-form-container" class="form-container">
    <form id="activities-form" class="item-form form-body" method="post" action="{{ url_for('timetable.create_item', item='activity') }}">
        <fieldset class="card-section">
            <legend class="section-title">General information</legend>

            <div class="field-group">
                <label for="name">Name</label>
                <input id="name" name="name" type="text" maxlength="30" required class="field-input" placeholder="Short title">
            </div>

            <div class="field-group">
                <label for="description">Description</label>
                <input id="description" name="description" type="text" maxlength="300" class="field-input" placeholder="Optional longer description">
            </div>
        </fieldset>

        <fieldset class="card-section">
            <legend class="section-title">Parameters</legend>

            <div class="field-group">
                <label for="priority">Priority</label>
                <input id="priority" name="priority" type="number" required class="field-input" value="0">
            </div>

            <div class="field-group">
                <label for="frequency">Frequency</label>
                <input id="frequency" name="frequency" type="number" required class="field-input" value="1">
            </div>

            <div class="field-group">
                <label for="even_frequency_spacing">Even spacing</label>
                <input id="even_frequency_spacing" name="even_frequency_spacing" type="checkbox" class="field-input">
            </div>

            <div class="field-group">
                <label for="max_length">Max length</label>
                <input id="max_length" name="max_length" type="number" class="field-input">
            </div>

            <div class="field-group">
                <label for="min_time">Min time</label>
                <input id="min_time" name="min_time" type="number" class="field-input">
            </div>
        </fieldset>

        <div class="form-actions">
            <button id="form-cancel-button" class="cancel-button form-btn" type="reset">Clear</button>
            <button id="form-submit-button" class="submit-button form-btn" type="submit">Create</button>
        </div>
    </form>

</div>


</div>

<div id="backdrop" onclick="toggleForms()" class="hidden fill-available"></div>


<!-- settings script -->
<script src="{{url_for('static',filename='js/scheduler.js')}}"></script>
