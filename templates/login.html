<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DT Login / Register</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}"/>

    <style>
        @font-face {
            font-family: Aleo;
            src: url("{{ url_for('static', filename='fonts/Aleo/Aleo-VariableFont_wght.ttf') }}");
        }
    </style>
</head>
<body>
<div id="content">
    <!-- Flash messages (used for both login & registration) -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <flashList class="flashes">
                {% for category, msg in messages %}
                    <li class="{{ category }}">{{ msg }}</li>
                {% endfor %}
            </flashList>
        {% endif %}
    {% endwith %}

    <h2>Dynamic Timetabler</h2>
    <h2 id="form-heading">Login</h2>
    <form id="auth-form">
        <label>Username:
            <input name="username" required>
        </label><br>

        <div id="display-name-wrapper" style="display:none;">
            <label>Display name:
                <input name="display_name">
            </label><br>
        </div>

        <label>Password:
            <input name="password" type="password" required>
        </label><br>

        <button type="submit" id="submit-btn">Log in</button>
    </form>

    <p style="margin-top:1rem;">
        <button id="toggle-btn" type="button">Switch to Register</button>
    </p>
</div>

<script>
let mode = 'login';

const heading        = document.getElementById('form-heading');
const submitBtn      = document.getElementById('submit-btn');
const toggleBtn      = document.getElementById('toggle-btn');
const displayWrapper = document.getElementById('display-name-wrapper');
const form           = document.getElementById('auth-form');


function switchToLogin() {
    mode = 'login';
    heading.textContent = 'Login';
    submitBtn.textContent = 'Log in';
    toggleBtn.textContent = 'Switch to Register';
    displayWrapper.style.display = 'none';
}

function switchToRegister() {
    mode = 'register';
    heading.textContent = 'Register';
    submitBtn.textContent = 'Create account';
    toggleBtn.textContent = 'Switch to Login';
    displayWrapper.style.display = 'block';
}

toggleBtn.addEventListener('click', () => {
    if (mode === 'login') {
        switchToRegister();
    } else {
        switchToLogin();
    }
});

form.addEventListener('submit', async (e) => {
    e.preventDefault();                 // we handle the request ourselves

    const formData = new FormData(form);
    const payload  = {
        username: formData.get('username').trim(),
        password: formData.get('password')
    };

    if (mode === 'register') {
        const displayName = formData.get('display_name').trim();
        if (displayName) payload.display_name = displayName;

        try {
            const resp = await fetch('{{ url_for("auth.register") }}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(payload)
            });

            const data = await resp.json();

            const flashList = document.querySelector('.flashes') || document.createElement('flashList');
            flashList.className = 'flashes';
            flashList.innerHTML = '';

            if (resp.ok) {
                const li = document.createElement('li');
                li.className = 'success';
                li.textContent = data.msg || 'Registration successful!';
                flashList.appendChild(li);
                document.body.prepend(flashList);
                switchToLogin();
            } else {
                const li = document.createElement('li');
                li.className = 'error';
                li.textContent = data.error || 'Something went wrong';
                flashList.appendChild(li);
                document.body.prepend(flashList);
            }
        } catch (err) {
            console.error(err);
            alert('Network error - see console for details.');
        }
        return;
    }

    form.action = '{{ url_for("auth.login") }}';
    form.method = 'post';
    form.submit();
});

switchToLogin();
</script>
</body>
</html>
