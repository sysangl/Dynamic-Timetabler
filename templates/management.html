<!-- management css -->
<link rel="stylesheet" href="{{url_for('static', filename='css/management.css')}}"></link>


<div class="form-container">

<form id="block-creation">
    <label for="title">Title</label>
    <input id="block-title-input" name="title" data-field="title" type="text" maxlength="30"></input><br>
    <label for="description">Description</label>
    <input id="block-description-input" name="description" data-field="description" type="text" maxlength="300"></input><br>
    <label for="start-date">Start Date</label>
    <input id="block-sdate-input" name="start-date" data-field="start_date" type="date"></input><br>
    <label for="start-time">Start Time</label>
    <input id="block-stime-input" name="start-time" data-field="start_time" type="time"></input><br>
    <label for="end-date">End Date</label>
    <input id="block-edate-input" name="end-date" data-field="end_date" type="date"></input><br>
    <label for="end-time">End Time</label>
    <input id="block-etime-input" name="end-time" data-field="end_time" type="time"></input><br>
    <label for="colour">Colour</label>
    <input id="block-colour-input" name="colour" data-field="colour" type="color" value="#3b3d19"></input>
    <input id="management-save-button" type="submit" value="CREATE"></input>
</form>

</div>


<!-- settings script -->
<script src="{{url_for('static',filename='js/management.js')}}"></script>
