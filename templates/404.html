<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not found</title>
</head>
<body>
    <style>
        @font-face {
            font-family: Aleo;
            src: url("{{url_for('static', filename='fonts/Aleo/Aleo-VariableFont_wght.ttf')}}");
        }
    </style>

    <div id="container">
        <div id="calendar-block">            
            <div id="code-text">
                <span>0</span>4<span>/</span>04
            </div>
            <div id="info-text">
                <span>Event: {{ url_string }}</span><br>
                <span>Status: </span>Not Found<br>
                <span>Description: </span>
            </div>
            <div id="small-text">
                <br>
                It appears that the page you're trying to access, does not exist.
            </div>
            <div id="links">
                <a id="home-link" href="/app">Home</a>
            </div>
        </div>
    </div>

</body>

<style>

* {
    overflow: hidden;
}

body {
    background-image: radial-gradient(circle at 1px 1px, #515151 1px, #1e1e1e 0);
    background-size: 41px 41px;
    color: #e1e1e1;
    font-family: Aleo;
    width: 100%;
    height: 100%;
}

#container {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: grid;
    margin: 20px;
}

#calendar-block {
    position: absolute;
    justify-self: center;
    align-self: center;
    width: 600px;
    height: 600px;
    padding: 20px;
    background: linear-gradient(0deg, #00000000 0%,#131313FF 30% );
    border-radius: 10px;
    box-sizing: border-box;
}

#code-text {
    font-size: 5rem;
    border-radius: 5px;
    background-color: #1a1a1a;
    padding: 10px;
}

#code-text span {
    filter: opacity(0.1);
}

#info-text {
    font-size: 3rem;
}

#info-text span {
    filter: opacity(0.1);
}

#small-text {
    font-size: 1.5rem;
}

#links {
    margin-top: 50px;
    width: 100%;
    display: grid;
    justify-items: center;
}

#home-link {
    font-size: 2rem;
    text-align: center;
    text-decoration: none;
    text-decoration-color: none;
    padding-left: 20px;
    padding-right: 20px;
    padding-top: 5px;
    padding-bottom: 5px;
    border: 1px solid white;
    border-radius: 5px;
}

#home-link:visited {
    color: #e1e1e1;
}

</style>

</html>
