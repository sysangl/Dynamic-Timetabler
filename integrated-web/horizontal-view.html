<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Timetable</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"/>
</head>
<body>
    <!-- common css -->
    <style>
        @import url("https://fonts.googleapis.com/css?family=Roboto");

        :root {
            --sidebar-width: 200px;
            --highlight-colour: rgb(137, 15, 165);
            --bg-colour-1: #1e1e1e;

        }

        html {
            overscroll-behavior: none;
        }

        body {
            background-color: var(--bg-colour-1);
            font-family: "Roboto";
            margin:0;
            overscroll-behavior: none;
            height: 100vh;
        }
        
        .centred-container {
            padding: 50px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            height: calc(100% - 60px);
            box-sizing: border-box;

            transition: margin-left 0.3s ease;
            margin-left: 0;
        }

        .centred-container.pushed {
            margin-left: var(--sidebar-width);
        }

        .section {
            display: none;
        }

        .active-section {
            display: initial;
        }

    </style>

    <!-- menus css -->
    <style>
        #topbar {
            position: sticky;
            width: 100%;
            height: 60px;
            background: var(--highlight-colour);
            display: flex;
            align-content: center;
        }

        #topbar-title {
            font-size: 1.6rem;
            font-family: "Roboto";
            color: #e1e1e1;
            left: 15px;
            align-content: center;
        }

        #topbar-user {
            width: 60px;
            color: #f5f5f5;
            font-size: 40px;
            align-content: center;
            right: 0;
        }


        .ham {
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: transform 400ms;
            -moz-user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .hamRotate.active {
            transform: rotate(45deg);
        }

        .line {
            fill:none;
            transition: stroke-dasharray 400ms, stroke-dashoffset 400ms;
            stroke:#e1e1e1;
            stroke-width:4;
            stroke-linecap:round;
        }

        .ham4 .top {
            stroke-dasharray: 40 121;
        }
        .ham4 .bottom {
            stroke-dasharray: 40 121;
        }
        .ham4.active .top {
            stroke-dashoffset: -68px;
        }
        .ham4.active .bottom {
            stroke-dashoffset: -68px;
        }

        #sidebar {
            position: absolute;
            left: 0;
            top: 60px;
            width: 0;
            height: calc(100% - 60px);
            background: #454545;
            overflow: hidden;
            transition: width 0.3s ease;
            z-index: 5;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        #sidebar.expanded {
            width: var(--sidebar-width);
        }

        #sidebar ul {
            margin: 0;
            list-style-type: none;
            left: 0;
            padding: 0;
        }

        #sidebar ul a li {
            width: var(--sidebar-width);
            padding: 15px;
            left: 0;
            justify-content: center;
            border-bottom: 1px solid rgba(255,255,255, 0.5);
            background-color: rgba(255,255,255,0);
            transition: background-color 0.2s ease;
        }

        #sidebar ul a li:hover {
            background-color: rgba(255, 255, 255, 0.25);
        }

        .sidebar-button {
            color: #f5f5f5;
            text-decoration: none;
            font-size: 20px;
        }


    </style>

    <!-- timetable css -->
    <style>

        #timetable-container {
            flex:1;
            display: flex;
            background: beige;
            overflow: hidden;
            border-radius: 5px;
            flex-direction: row;
        }

        #tt-legend {
            display: flex;
            flex-direction: column;
            flex: 0 0 15%;
            background: #f5f5f5;
        }

        #tt-topbar-time {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #c8c7c7;
            color: #1e1e1e;
            font-weight: bold;
            font-size: 1.5rem;
            padding: 10px;
        }

        .tt-weekday {
            flex:1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e1e1e1;
            color: black;
            border-top: 1px solid #c0c0c0;
        }

        #tt-schedule-container {
            position: relative;
            display: flex;
            flex: 1;
            flex-direction: column;
            background: #454545;
            overflow-x: auto;
            overflow-y: hidden;
            overscroll-behavior: none;
        }

        #tt-topbar-timeline {
            position: sticky;
            top: 0;
            z-index: 1;
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 10px 0;
            background: #252525;
            flex-shrink: 0;
        }

        .timeline-number,
        .timeline-number-pm {
            flex: 0 0 100px;
            white-space: nowrap;
            color: #f5f5f5;
            padding-left: 5px;
        }



        #time-marker {
            position: absolute;
            top: 0;
            width: 1px;
            left: 100px;
            height: 100%;
            background: rgba(255,0,0,0.5);
            z-index: 3;
        }

        #tt-schedule {
            flex:1;
            flex-shrink: 0;
            width: max-content;
            border-bottom: 1px solid #c0c0c0;
            overflow-x: visible;
        }

        #hour-lines {
            position: absolute;
            top: 0;
            left: 0;
            display: grid;
            grid-template-columns: repeat(24, 1fr);
            grid-template-rows: repeat(1, 1fr);
            pointer-events: none;
            z-index: 1;
        }

        #day-lines {
            position: absolute;
            top: 0;
            left: 0;
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            grid-template-rows: repeat(7, 1fr);
            pointer-events: none;
            z-index: 1;
        }

        #hour-lines > div {
            border-right: 1px solid rgba(255,255,255,0.15);
        }
        
        #day-lines > div {
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }



    </style>

    <!-- settings css -->
    <style>
        #settings {
            color: #f5f5f5;
        }

        .settings-section-container {
            border-radius: 2px;
            background-color: #252525;
            padding: 10px;
        }

        .settings-list {
            list-style-type: none;
            margin: 0;
            padding: 0;
        }

        .settings-section-title {
            font-size: 20px;
            font-weight: bold;
        }

        .settings-description {
            margin-top: 10px;
            color: #c0c0c0;
            font-size: 14px;
        }

        .settings-option-name {
            font-size: 16px;
        }

        .settings-option {
            font-size: 16px;
        }

    </style>


    <div id="topbar">
        <div>
            <svg class="ham hamRotate ham4" viewBox="0 0 100 100" width="60" onclick="toggleSidebar()">
            <path
                    class="line top"
                    d="m 70,33 h -40 c 0,0 -8.5,-0.149796 -8.5,8.5 0,8.649796 8.5,8.5 8.5,8.5 h 20 v -20" />
            <path
                    class="line middle"
                    d="m 70,50 h -40" />
            <path
                    class="line bottom"
                    d="m 30,67 h 40 c 0,0 8.5,0.149796 8.5,-8.5 0,-8.649796 -8.5,-8.5 -8.5,-8.5 h -20 v 20" />
            </svg>
        </div>
        <div id="topbar-title">Dynamic Timetabler</div>

        <div id="topbar-user"><span class="fa fa-user"></span></div>
    </div>

    <div id="sidebar">
        <ul>
            <a class="sidebar-button" href="#" onclick="switchTabTo('timetable')"><li><span class="fa fa-calendar"></span> Timetable</li></a>
            <a class="sidebar-button" href="#" onclick="switchTabTo('settings')"><li><span class="fa fa-cog"></span> Settings</li></a>
        </ul>
    </div>

    <section class="section active-section" id="timetable">
    <div class="centred-container">
        <div id="timetable-container">
            <div id="tt-legend">
                <div id="tt-topbar-time">-</div>
                <div class="tt-weekday">Mon</div>
                <div class="tt-weekday">Tues</div>
                <div class="tt-weekday">Wed</div>
                <div class="tt-weekday">Thurs</div>
                <div class="tt-weekday">Fri</div>
                <div class="tt-weekday">Sat</div>
                <div class="tt-weekday">Sun</div>
            </div>
            
            <div id="tt-schedule-container">
                <div id="time-marker"></div>
                <div id="tt-topbar-timeline"></div>
                <div id="tt-schedule">
                    <div id="day-lines"></div>
                    <div id="hour-lines"></div>
                </div>
            </div>
        </div>
    </div>
    </section>


    <section class="section" id="settings">
        <div class="centred-container">
            <div class="settings-section-container">
                <ul class="settings-list">
                    <li class="settings-section-title">Timetable</li>
                    <li class="settings-description">When does your week start (default : Monday)</li>
                    <li class="settings-option-name">Starting Day</li>
                    <li class="settings-description">When does your day start (default : 5am)</li>
                    <li class="settings-option-name">Starting Hour</li>
                </ul>
            </div>
        </div>

    </section>

    <!-- common script -->
    <script>

        function toggleSidebar() {
            const sidebar = document.getElementById("sidebar");
            const containers = document.getElementsByClassName("centred-container");
            const ham = document.querySelector('.ham');

            sidebar.classList.toggle('expanded');
            for (let container of containers) {
                container.classList.toggle('pushed');
            }
            ham.classList.toggle('active');
        }

        function switchTabTo(tab) {
            if (current_tab == tab) return;
            document.getElementById(current_tab).classList.toggle('active-section');
            document.getElementById(tab).classList.toggle('active-section');
            current_tab = tab;
        }
    </script>

    <!-- timetable script -->
    <script>
        // what is the start of the week
        // [mon,tue,wed,thur,fri,sat,sun]
        // stored as an index
        // e.g. if startDay = 2, day = wed
        const startDay = 0;
        const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"]
        // when does the day start
        const startHour = 5;
        const dayMs = 24 * 60 * 60 * 1000;

        // eventually store this locally
        var current_tab = 'timetable';

        function clamp(value, min, max) {
            if (value < min) {
                return min
            }
            if (value > max) {
                return max
            }
        }

        function generateWeek() {
            document.getElementById("tt-legend").innerHTML = '<div id="tt-topbar-time">-</div>';
            for (let dayIdx = startDay; dayIdx < 7; dayIdx++) {
                    document.getElementById("tt-legend").innerHTML+='<div class="tt-weekday">'+days[dayIdx]+'</div>';
            }
            for (let dayIdx = 0; dayIdx < startDay; dayIdx++) {
                document.getElementById("tt-legend").innerHTML+='<div class="tt-weekday">'+days[dayIdx]+'</div>';
            }
        }

        function generateTimeline() {
            document.getElementById("tt-topbar-timeline").innerHTML = "";
            for (let hour = startHour; hour < 24; hour++) {
                if (hour >= 12 ) {
                    document.getElementById("tt-topbar-timeline").innerHTML+='<div class="timeline-number-pm"> '+hour+'</div>';
                } else {
                    document.getElementById("tt-topbar-timeline").innerHTML+='<div class="timeline-number"> '+hour+'</div>';
                }
            }
            for (let hour = 0; hour < startHour; hour++) {
                if (hour >= 12 ) {
                    document.getElementById("tt-topbar-timeline").innerHTML+='<div class="timeline-number-pm"> '+hour+'</div>';
                } else {
                    document.getElementById("tt-topbar-timeline").innerHTML+='<div class="timeline-number"> '+hour+'</div>';
                }
            }
        }

        function buildGrid() {
            const tl = document.getElementById('tt-topbar-timeline');
            const ts = document.getElementById('tt-schedule')
            const l = document.getElementById('tt-legend');
            const hl = document.getElementById('hour-lines');
            const dl = document.getElementById('day-lines');


            hl.style.width = tl.scrollWidth + 'px';
            hl.style.height = l.scrollHeight + 'px';
            dl.style.top = tl.scrollHeight + 'px';
            dl.style.width = tl.scrollWidth + 'px';
            dl.style.height = ts.scrollHeight + 'px';

            let hlHtml = '';
            for (let i=0; i<24; i++) hlHtml += '<div></div>';
            hl.innerHTML = hlHtml;

            let dlHtml = '';
            for (let i=0; i<7; i++) dlHtml += '<div></div>';
            dl.innerHTML = dlHtml;
        }

        // gives the progress through the day. returns a float from 0 to 1
        function dayProgress() {
            const now = new Date();
            const start = new Date(now.getFullYear() , now.getMonth(), now.getDate());
            const msSinceMidnight = now - start;
            return msSinceMidnight / dayMs;
        }

        // gives the progress through the schedule (starts at startHour instead of 00:00)
        function scheduleProgress() {
            const now = new Date();
            const start = new Date(now.getFullYear() , now.getMonth(), now.getDate(), startHour, 0, 0, 0)
        
            let elapsed = now - start;
            if (elapsed<0) elapsed += dayMs;

            return elapsed / dayMs;
        }

        function alignTimeMarker() {
            const left = document.getElementById("tt-topbar-timeline").scrollWidth * scheduleProgress();

            document.getElementById("time-marker").style.left = left + "px";
        }

        function alignTimetimetableView() {
            const schedule = document.getElementById("tt-schedule-container")
            const marker = document.getElementById("time-marker")
            const tl = document.getElementById("tt-topbar-timeline")

            var scroll = parseInt(marker.style.left) - (tl.scrollWidth/24)*2.5;
            if (scroll < 0) scroll = 0;
            schedule.scrollLeft = scroll;
        }



        function formatTime(number) {
            return number < 10 ? '0' + number : number;
        }


        function updateTime() {
            const clock = document.getElementById('tt-topbar-time');
            const now = new Date();
            let hours = formatTime(now.getHours());
            let minutes = formatTime(now.getMinutes());

            clock.innerHTML = hours + ':' + minutes
        }

        //*move time marker every minute
        
        $(document).ready(function () {
            generateWeek();
            generateTimeline();
            buildGrid();
            document.getElementById('tt-topbar-timeline').style.width=document.getElementById('tt-topbar-timeline').scrollWidth+'px';
            alignTimeMarker();
            setInterval(alignTimeMarker, 60*1000);
            updateTime();
            setInterval(updateTime(), 5*1000);
            alignTimetimetableView();
        })
    </script>

    <!-- settings script -->
    <script>

    </script>

</body>
</html>
