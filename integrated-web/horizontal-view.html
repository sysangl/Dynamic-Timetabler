<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Timetable</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
</head>
<body>
    <style>
        @import url("https://fonts.googleapis.com/css?family=Roboto");


        body {
            background-color: #1e1e1e;
            font-family: "Roboto";
            margin:0;
        }
        
        #centred-container {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 90%;
            height: 90%;
            transform: translate(-50%,-50%);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        #timetable-container {
            flex:1;
            display: flex;
            background: beige;
            overflow: hidden;
            border-radius: 5px;
            flex-direction: row;
        }

        #tt-legend {
            display: flex;
            flex-direction: column;
            flex: 0 0 15%;
            background: #f5f5f5;
        }

        #tt-topbar-days {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #c8c7c7;
            color: #1e1e1e;
            font-weight: bold;
            font-size: 1.5rem;
            padding: 10px;
        }

        .tt-weekday {
            flex:1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e1e1e1;
            color: black;
            border-top: 1px solid #c0c0c0;
        }

        #tt-schedule-container {
            position: relative;
            display: flex;
            flex: 1;
            flex-direction: column;
            background: #454545;
            overflow-x: auto;
            overflow-y: hidden;
            overscroll-behavior: none;
        }

        #tt-topbar-timeline {
            position: sticky;
            top: 0;
            z-index: 1;
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 10px 0;
            background: #252525;
            flex-shrink: 0;
        }

        .timeline-number,
        .timeline-number-pm {
            flex: 0 0 100px;
            white-space: nowrap;
            color: #f5f5f5;
            padding-left: 5px;
        }



        #time-marker {
            position: absolute;
            top: 0;
            width: 1px;
            left: 100px;
            height: 100%;
            background: rgba(255,0,0,0.5);
            z-index: 3;
        }

        #tt-schedule {
            flex:1;
            flex-shrink: 0;
            width: max-content;
            border-bottom: 1px solid #c0c0c0;
            overflow-x: visible;
        }

        #hour-lines {
            position: absolute;
            top: 0;
            left: 0;
            display: grid;
            grid-template-columns: repeat(24, 1fr);
            grid-template-rows: repeat(1, 1fr);
            pointer-events: none;
            z-index: 1;
        }

        #day-lines {
            position: absolute;
            top: 0;
            left: 0;
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            grid-template-rows: repeat(7, 1fr);
            pointer-events: none;
            z-index: 1;
        }

        #hour-lines > div {
            border-right: 1px solid rgba(255,255,255,0.15);
        }
        
        #day-lines > div {
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }

    </style>


    <div id="centred-container">
        <div style="font-size: 28px; color: #fff;">Dynamic Timetable</div>
        <div id="timetable-container">
            <div id="tt-legend">
                <div id="tt-topbar-days">-</div>
                <div class="tt-weekday">Mon</div>
                <div class="tt-weekday">Tues</div>
                <div class="tt-weekday">Wed</div>
                <div class="tt-weekday">Thurs</div>
                <div class="tt-weekday">Fri</div>
                <div class="tt-weekday">Sat</div>
                <div class="tt-weekday">Sun</div>
            </div>
            
            <div id="tt-schedule-container">
                <div id="time-marker"></div>
                <div id="tt-topbar-timeline"></div>
                <div id="tt-schedule">
                    <div id="day-lines"></div>
                    <div id="hour-lines"></div>
                </div>
            </div>
        </div>
    </div>


    <script>
        // what is the start of the week
        // [mon,tue,wed,thur,fri,sat,sun]
        // stored as an index
        // e.g. if startDay = 2, day = wed
        const startDay = 6;
        const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"]
        // when does the day start
        const startHour = 5;
        const dayMs = 24 * 60 * 60 * 1000;

        function generateWeek() {
            document.getElementById("tt-legend").innerHTML = '<div id="tt-topbar-days">-</div>';
            for (let dayIdx = startDay; dayIdx < 7; dayIdx++) {
                    document.getElementById("tt-legend").innerHTML+='<div class="tt-weekday">'+days[dayIdx]+'</div>';
            }
            for (let dayIdx = 0; dayIdx < startDay; dayIdx++) {
                document.getElementById("tt-legend").innerHTML+='<div class="tt-weekday">'+days[dayIdx]+'</div>';
            }
        }

        function generateTimeline() {
            document.getElementById("tt-topbar-timeline").innerHTML = "";
            for (let hour = startHour; hour < 24; hour++) {
                if (hour >= 12 ) {
                    document.getElementById("tt-topbar-timeline").innerHTML+='<div class="timeline-number-pm"> '+hour+'</div>';
                } else {
                    document.getElementById("tt-topbar-timeline").innerHTML+='<div class="timeline-number"> '+hour+'</div>';
                }
            }
            for (let hour = 0; hour < startHour; hour++) {
                if (hour >= 12 ) {
                    document.getElementById("tt-topbar-timeline").innerHTML+='<div class="timeline-number-pm"> '+hour+'</div>';
                } else {
                    document.getElementById("tt-topbar-timeline").innerHTML+='<div class="timeline-number"> '+hour+'</div>';
                }
            }
        }

        function buildGrid() {
            const tl = document.getElementById('tt-topbar-timeline');
            const ts = document.getElementById('tt-schedule')
            const l = document.getElementById('tt-legend');
            const hl = document.getElementById('hour-lines');
            const dl = document.getElementById('day-lines');


            hl.style.width = tl.scrollWidth + 'px';
            hl.style.height = l.scrollHeight + 'px';
            dl.style.top = tl.scrollHeight + 'px';
            dl.style.width = tl.scrollWidth + 'px';
            dl.style.height = ts.scrollHeight + 'px';

            let hlHtml = '';
            for (let i=0; i<24; i++) hlHtml += '<div></div>';
            hl.innerHTML = hlHtml;

            let dlHtml = '';
            for (let i=0; i<7; i++) dlHtml += '<div></div>';
            dl.innerHTML = dlHtml;
        }

        // gives the progress through the day. returns a float from 0 to 1
        function dayProgress() {
            const now = new Date();
            const start = new Date(now.getFullYear() , now.getMonth(), now.getDate());
            const msSinceMidnight = now - start;
            return msSinceMidnight / dayMs;
        }

        // gives the progress through the schedule (starts at startHour instead of 00:00)
        function scheduleProgress() {
            const now = new Date();
            const start = new Date(now.getFullYear() , now.getMonth(), now.getDate(), startHour, 0, 0, 0)
        
            let elapsed = now - start;
            if (elapsed<0) elapsed += dayMs;

            return elapsed / dayMs;
        }

        function alignTimeMarker() {
            const left = document.getElementById("tt-topbar-timeline").scrollWidth * scheduleProgress();

            document.getElementById("time-marker").style.left = left + "px";
        }



        //*move time marker every minute
        
        $(document).ready(function () {
            generateWeek();
            generateTimeline();
            buildGrid();
            document.getElementById('tt-topbar-timeline').style.width=document.getElementById('tt-topbar-timeline').scrollWidth+'px';
            alignTimeMarker();
            setInterval(alignTimeMarker, 60*1000);
        })
    </script>

</body>
</html>
